version: 2.1
orbs:
  browser-tools: circleci/browser-tools@1.5.3
jobs:
  build:
    docker:
      - image: cimg/php:8.4-browsers
      - image: cimg/mysql:5.7
        environment:
          MYSQL_DATABASE: laravel
          MYSQL_USER: laravel
          MYSQL_PASSWORD: secrets
    environment:
      APP_URL: http://127.0.0.1:8000
      DB_HOST: 127.0.0.1
      DB_DATABASE: laravel
      DB_USERNAME: laravel
      DB_PASSWORD: secrets
      DUSK_DRIVER_URL: http://127.0.0.1:9515
    steps:
      - checkout
      - restore_cache:
          keys:
            - php84-dependencies-{{ checksum "composer.lock" }}
      - run: composer install -n --prefer-dist
      - run: composer check-platform-reqs
      - save_cache:
          key: php84-dependencies-{{ checksum "composer.lock" }}
          paths:
            - ./vendor
      - restore_cache:
          keys:
            - node-v2-{{ checksum "package-lock.json" }}
      - run: npm ci
      - save_cache:
          key: node-v2-{{ checksum "package-lock.json" }}
          paths:
            - node_modules
      - run: node --version
      - run: npm run build
      - run: cp .env.example .env
      - run: php artisan key:generate
      - run:
          name: SQLite regression suite
          command: |
            DB_CONNECTION=sqlite DB_DATABASE=:memory: vendor/bin/phpunit
      - run:
          name: MySQL regression suite (disposable CI database)
          command: DB_CONNECTION=mysql vendor/bin/phpunit
      - browser-tools/install-chrome
      - browser-tools/install-chromedriver
      - run: php artisan migrate:fresh --seed --no-interaction
      - run:
          name: Run ChromeDriver
          command: chromedriver --port=9515
          background: true
      - run:
          name: Run Laravel Server
          command: php artisan serve --host=127.0.0.1 --port=8000
          background: true
      - run:
          name: Builder browser regression suite
          command: |
            curl --fail --silent --show-error --retry 15 --retry-connrefused --retry-delay 1 "$DUSK_DRIVER_URL/status"
            php artisan dusk
      - store_artifacts:
          path: tests/Browser/screenshots
      - store_artifacts:
          path: tests/Browser/console
